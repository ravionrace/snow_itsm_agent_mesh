[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "itsm-agent-runtime"
version = "0.1.0"
description = "LangGraph agent runtime for the ServiceNow ITSM agent mesh: coordinator, domain agents, guardrails and evals."
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.12",
    "langgraph-checkpoint-mongodb==0.5.0",
    "anthropic==1.11.0",
    "mcp==2.3.0",
    "fastapi>=0.142",
    "uvicorn>=0.37",
    "pydantic>=2.13",
    "pydantic-settings>=2.11",
    "sqlalchemy>=2.1",
    "pymysql>=1.1",
    "pymongo>=4.17",
    "httpx2>=2.13",
    "opentelemetry-sdk>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1.0", "httpx>=0.28"]

[project.scripts]
itsm-runtime = "itsm_agents.api:main"
itsm-evals = "itsm_agents.evals.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"itsm_agents.evals" = ["data/*.jsonl", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

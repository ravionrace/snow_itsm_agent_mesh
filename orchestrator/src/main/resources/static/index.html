<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT Service Assistant</title>
<style>
  :root { --bg:#f6f7f9; --panel:#fff; --text:#1d2330; --muted:#5d6577; --line:#dfe3ea; --accent:#2457d6;
          --user:#e8efff; --warn-bg:#fff6e5; --warn:#8a5300; --ok:#1d7a3e; --bad:#b42318; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#12151b; --panel:#1b1f27; --text:#e6e9ef; --muted:#9aa3b5; --line:#2c323d;
      --accent:#7ea2ff; --user:#24304a; --warn-bg:#33270f; --warn:#f2c46b; --ok:#6fd49a; --bad:#ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; gap:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; margin:0; }
  header small { color:var(--muted); }
  #log { flex:1; overflow-y:auto; padding:16px 0; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width: 92%; padding:10px 14px; border-radius:10px; background:var(--panel); border:1px solid var(--line); white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; background:var(--user); border-color:transparent; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:4px; }
  .card { border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:8px; padding:12px; background:var(--panel); }
  .card h3 { margin:0 0 8px; font-size:14px; }
  .card table { width:100%; border-collapse:collapse; font-size:13px; }
  .card td { padding:4px 6px; border-top:1px solid var(--line); vertical-align:top; overflow-wrap:anywhere; }
  .card td:first-child { color:var(--muted); width:30%; }
  .warn { background:var(--warn-bg); color:var(--warn); padding:6px 8px; border-radius:6px; margin-top:8px; font-size:13px; }
  .actions { display:flex; gap:8px; margin-top:10px; }
  button { font:inherit; border-radius:6px; padding:7px 14px; border:1px solid var(--line); background:var(--panel); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.5; cursor:default; }
  form { display:flex; gap:8px; padding-top:12px; border-top:1px solid var(--line); }
  textarea { flex:1; resize:none; font:inherit; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--panel); color:var(--text); min-height:46px; }
  input#user { font:inherit; padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--text); width:150px; }
  .status { font-size:13px; }
  .status.ok { color:var(--ok); } .status.bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>IT Service Assistant</h1><small>Incidents, problems, changes and catalog requests</small></div>
    <label><small>Dev user </small><input id="user" placeholder="user id" aria-label="Dev user id"></label>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="f">
    <textarea id="m" placeholder="Describe what you need…" aria-label="Message"></textarea>
    <button class="primary" id="send">Send</button>
  </form>
</main>
<script>
// Token handling: in production the host page (portal widget, Teams tab) supplies an IdP access token via
// window.ITSM_TOKEN. Locally, with itsm.auth.mode=DEV, the "Dev user" field is sent as X-Dev-User.
let sessionId = null;
const log = document.getElementById('log');
const userInput = document.getElementById('user');
try { userInput.value = localStorage.getItem('itsm.devUser') || ''; } catch (e) {}

function headers() {
  const h = {'Content-Type': 'application/json'};
  if (window.ITSM_TOKEN) h['Authorization'] = 'Bearer ' + window.ITSM_TOKEN;
  else if (userInput.value) h['X-Dev-User'] = userInput.value;
  return h;
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function add(role, text, meta) {
  const d = el('div', 'msg ' + role);
  if (meta) d.appendChild(el('div', 'meta', meta));
  d.appendChild(document.createTextNode(text));
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function pendingCard(p) {
  const c = el('div', 'card');
  const pv = p.preview || {};
  c.appendChild(el('h3', null, (pv.action || p.tool) + (pv.record ? ' · ' + pv.record : '')));
  const t = el('table');
  (pv.changes || []).forEach(ch => {
    const tr = el('tr'); tr.appendChild(el('td', null, ch.field));
    tr.appendChild(el('td', null, (ch.from ? ch.from + ' → ' : '') + ch.to)); t.appendChild(tr);
  });
  c.appendChild(t);
  (pv.warnings || []).forEach(w => c.appendChild(el('div', 'warn', w)));
  const a = el('div', 'actions');
  const ok = el('button', 'primary', 'Confirm'); const no = el('button', null, 'Reject');
  const status = el('span', 'status');
  ok.onclick = () => decide(p.id, 'confirm', ok, no, status);
  no.onclick = () => decide(p.id, 'reject', ok, no, status);
  a.append(ok, no, status); c.appendChild(a);
  log.appendChild(c); log.scrollTop = log.scrollHeight;
}
function render(r) {
  if (r.notice) add('assistant', r.notice, 'Privacy');
  if (r.reply) add('assistant', r.reply, (r.agent || 'assistant') + ' agent');
  if (r.pending) pendingCard(r.pending);
}
async function call(url, body) {
  const res = await fetch(url, {method: 'POST', headers: headers(), body: JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || data.detail || data.error || ('HTTP ' + res.status));
  return data;
}
async function decide(id, decision, ok, no, status) {
  ok.disabled = no.disabled = true; status.textContent = decision === 'confirm' ? 'Applying…' : 'Cancelling…';
  try {
    const r = await call(`/api/sessions/${sessionId}/confirmations/${id}`, {decision});
    status.textContent = decision === 'confirm' ? 'Confirmed' : 'Rejected'; status.className = 'status ok';
    render(r);
  } catch (e) { status.textContent = e.message; status.className = 'status bad'; }
}
document.getElementById('f').onsubmit = async (ev) => {
  ev.preventDefault();
  const m = document.getElementById('m'); const text = m.value.trim(); if (!text) return;
  try { localStorage.setItem('itsm.devUser', userInput.value); } catch (e) {}
  add('user', text); m.value = '';
  const btn = document.getElementById('send'); btn.disabled = true;
  const wait = add('assistant', 'Working…');
  try {
    const r = await call('/api/chat', {sessionId, message: text});
    sessionId = r.session_id; wait.remove(); render(r);
  } catch (e) { wait.textContent = 'Error: ' + e.message; }
  btn.disabled = false;
};
document.getElementById('m').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); }
});
</script>
</body>
</html>

# HTTPS entry point for the ServiceNow in-app Assistant (installed by deploy/scripts/setup-nginx.sh).
# Only the signed ServiceNow channel is forwarded to the Java orchestrator (published on 127.0.0.1:8080 by Docker).
# Everything else - the DEV chat UI, /api, actuator - returns 404 from here.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __PUBLIC_HOST__;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_HOST__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:itsm_ssl:10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 64k;            # chat messages are small; the orchestrator also caps bodies at 64 KB

    location /channel/servicenow/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;          # turns run in the background; every channel call is short
    }

    location / {
        return 404;
    }

    access_log /var/log/nginx/itsm-mesh.access.log;
    error_log  /var/log/nginx/itsm-mesh.error.log warn;
}

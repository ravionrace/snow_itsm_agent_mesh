# Port 80 for __PUBLIC_HOST__: Let's Encrypt challenges, everything else redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name __PUBLIC_HOST__;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
